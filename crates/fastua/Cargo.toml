[package]
name = "fastua"
version = "0.1.0"
description = "Ultra-light, ultra-fast OPC UA server with hot-reloaded address space"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fastua"
path = "src/main.rs"

[dependencies]
arc-swap = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
io-uring = "0.7.16"

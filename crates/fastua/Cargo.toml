[package]
name = "fastua"
version = "0.1.0"
description = "Ultra-light, ultra-fast OPC UA server with hot-reloaded address space"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fastua"
path = "src/main.rs"

[dependencies]
arc-swap = "1"
aws-lc-rs = "1.19.0"
libc = "0.2"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["compress"] }
time = "0.3.44"
x509-parser = { version = "0.18", default-features = false }

# The aarch64 SHA-2 instructions are behind sha2's "asm" feature (x86 SHA-NI is
# detected at run time without it).
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["compress", "asm"] }
